# Rule Engine Configuration
rules:
  - id: "rule_zone_01"
    name: "Restricted Area Intrusion"
    enabled: true
    type: "zone_intrusion"
    params:
      target_classes: ["person"]
      zone:
        points:
          - [200, 150]
          - [600, 150]
          - [600, 550]
          - [200, 550]
    alert:
      severity: "high"
      message: "Unauthorized person detected in restricted safety zone"
      cooldown_sec: 15

  - id: "rule_count_01"
    name: "Vehicle Line Crossing Counter"
    enabled: true
    type: "line_crossing"
    params:
      target_classes: ["car", "truck", "bus", "motorcycle"]
      line:
        start: [100, 400]
        end: [1180, 400]
      direction: "down"
    alert:
      severity: "info"
      message: "Vehicle entered controlled facility gate"
      cooldown_sec: 1

